name: Update Fimea medicine registry

on:
  schedule:
    - cron: "17 8 * * 1"
      timezone: "Europe/Helsinki"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medicine-registry-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate registry
        run: python3 Scripts/generate_medicine_registry.py

      - name: Run generator tests
        run: python3 -m unittest discover -s Scripts/tests -v

      - name: Commit changed registry
        shell: bash
        run: |
          git add Data/medicines.txt Data/medicines-metadata.json

          if git diff --cached --quiet; then
            echo "Fimea data has not changed."
            exit 0
          fi

          source_date=$(python3 -c 'import json; print(json.load(open("Data/medicines-metadata.json", encoding="utf-8"))["fimeaSourceDate"])')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Fimea registry ${source_date}"
          git push
